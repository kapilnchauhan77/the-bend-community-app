# Run from a clean, committed checkout. No production secrets are build inputs.
substitutions:
  _REVISION: unset
  _VITE_API_URL: https://api.bend.community/api/v1
  _VITE_BASE_DOMAIN: bend.community
  _VITE_CF_ANALYTICS_TOKEN: ''
steps:
  - id: build-test-publish
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ '${_REVISION}' =~ ^[0-9a-f]{40}$$ ]]
        docker buildx create --name bend-build --driver docker-container --use
        docker buildx build --progress=plain --platform=linux/amd64 \
          --target test --load -t bend-backend-test \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/bend-backend-cache:build \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/bend-backend-cache:build,mode=max \
          the-bend-backend
        docker run --rm -v /workspace:/repo -w /repo/the-bend-backend bend-backend-test
        docker run --rm -v /workspace:/repo -w /repo bend-backend-test \
          python -m pytest tests/test_image_deploy.py -q
        docker buildx build --progress=plain --platform=linux/amd64 \
          --target production --push \
          --build-arg REVISION=${_REVISION} \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/bend-backend-cache:build \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/bend-backend-cache:build,mode=max \
          -t gcr.io/$PROJECT_ID/bend-backend:${_REVISION} the-bend-backend
        docker buildx build --progress=plain --platform=linux/amd64 \
          --target production --push \
          --build-arg REVISION=${_REVISION} \
          --build-arg VITE_API_URL=${_VITE_API_URL} \
          --build-arg VITE_BASE_DOMAIN=${_VITE_BASE_DOMAIN} \
          --build-arg VITE_CF_ANALYTICS_TOKEN=${_VITE_CF_ANALYTICS_TOKEN} \
          --cache-from=type=registry,ref=gcr.io/$PROJECT_ID/bend-frontend-cache:build \
          --cache-to=type=registry,ref=gcr.io/$PROJECT_ID/bend-frontend-cache:build,mode=max \
          -t gcr.io/$PROJECT_ID/bend-frontend:${_REVISION} the-bend-frontend
        docker pull gcr.io/$PROJECT_ID/bend-frontend:${_REVISION}
        docker run --rm gcr.io/$PROJECT_ID/bend-frontend:${_REVISION} nginx -t
        docker run --rm gcr.io/$PROJECT_ID/bend-frontend:${_REVISION} \
          sh -ceu 'nginx; wget -q -O /dev/null http://127.0.0.1/'
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
