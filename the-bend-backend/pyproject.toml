[project]
name = "the-bend-backend"
version = "0.1.0"
description = "The Bend Community App - Backend API"
authors = []
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pywebpush>=2.0.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "aiohttp>=3.14.0,<3.15.0",
    "Pillow>=10.0.0",
    "icalendar>=5.0.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "lxml>=4.9.0",
    "stripe>=8.0.0",
    "sendgrid>=6.0.0",
    "ffmpeg-python>=0.2.0",
    "firebase-admin>=6.5.0",
    "aioapns>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "factory-boy>=3.3.0",
]

[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
